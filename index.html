<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Two Unicorns: enterable testimony spatial prototype." />
    <title>Two Unicorns</title>
  </head>
  <body>
    <div id="app">
      <div id="overlay" class="overlay">
        <div class="overlay-card">
          <p class="eyebrow">Two Unicorns</p>
          <h1>Enter the room</h1>
          <p>
            ↑ / W — move forward<br />
            ↓ / S — move backward<br />
            ← / A — turn left<br />
            → / D — turn right
          </p>
          <p>The mouse does not control the camera.</p>
          <button id="enter-button" type="button">Enter room</button>
        </div>
      </div>
      <div id="hud" class="hud" aria-live="polite">Two Unicorns</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
